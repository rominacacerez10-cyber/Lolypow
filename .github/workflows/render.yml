name: Render Native Short

on:
  push:
    branches: [ main, master ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Renderizar video nativo con Remotion
        run: npm run render -- --overwrite

      - name: Guardar archivo MP4 renderizado
        uses: actions/upload-artifact@v4
        with:
          name: short-native-mp4
          path: ./out/video.mp4

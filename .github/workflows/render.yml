name: Render Short Low Poly

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descomprimir y ubicar proyecto
        run: |
          mkdir -p extracted
          unzip -q shorts-lowpoly-skill.zip -d extracted
          PROJECT_DIR=$(find extracted -name "package.json" -exec dirname {} \; | head -n 1)
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Instalar dependencias del proyecto
        run: npm install
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Renderizar video con Remotion
        run: npx remotion render src/index.ts Ejemplo ./out/video.mp4 --overwrite
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Guardar archivo MP4 renderizado
        uses: actions/upload-artifact@v4
        with:
          name: short-lowpoly-mp4
          path: ${{ env.PROJECT_PATH }}/out/video.mp4

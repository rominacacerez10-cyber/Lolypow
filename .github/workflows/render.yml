name: Render Short Low Poly

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del proyecto
        run: npm install
        working-directory: ./proyecto

      - name: Renderizar video con Remotion
        run: npx remotion render src/index.ts MainVideo out/video.mp4
        working-directory: ./proyecto

      - name: Guardar archivo MP4 renderizado
        uses: actions/upload-artifact@v4
        with:
          name: short-lowpoly-mp4
          path: proyecto/out/video.mp4
